# Model prices in USD per 1M tokens (Gemini API, paid tier).
# Source: https://ai.google.dev/gemini-api/docs/pricing (last updated 2026-10-09).
# Text prices for prompts <= 200k tokens. Every cost Trim-T reports comes from this file.
#
# tier: premium = expensive default model, budget = cheapest option.
# reasoning: the model spends billed "thinking" tokens by default.

source: https://ai.google.dev/gemini-api/docs/pricing
retrieved: 2026-10-11

models:
  gemini-3.8-flash:
    tier: premium
    reasoning: true
    input: 0.75          # through 2026-12-31; 1.50 from 2027-01-01
    output: 3.75         # through 2026-12-31; 7.50 from 2027-01-01
    cached_input: 0.075  # through 2026-12-31; 0.15 from 2027-01-01

  gemini-3.5-flash-lite:
    tier: standard
    reasoning: false
    input: 0.30
    output: 2.50
    cached_input: 0.03

  gemini-3.1-flash-lite:
    tier: budget
    reasoning: false
    input: 0.25
    output: 1.50
    cached_input: 0.025

  gemini-2.5-flash-lite:
    tier: budget
    reasoning: false
    input: 0.10
    output: 0.40
    cached_input: 0.01
